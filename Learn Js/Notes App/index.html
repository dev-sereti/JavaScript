<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Notes App</title>

  <!-- Link to external CSS for styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main container for the notes app -->
  <div class="app-container">
    <h1>My Notes App</h1>

    <!-- Input area for new notes -->
    <div class="note-input">
      <textarea id="noteText" placeholder="Write your note here..."></textarea>
      <button id="saveBtn">Save Note</button>
    </div>

    <!-- Container that will display all notes -->
    <div id="notesContainer" class="notes-container">
      <!-- Notes will be dynamically added here using JavaScript -->
    </div>
  </div>

  <!-- Link to external JavaScript for functionality -->
  <script src="script.js"></script>
</body>
</html>
